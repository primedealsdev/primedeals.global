name: Site checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate pages, links, SEO tags, JSON-LD and sitemap
        run: node scripts/check-site.mjs
